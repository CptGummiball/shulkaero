pluginManagement {
    repositories {
        maven {
            name = 'FabricMC'
            url = uri('https://maven.fabricmc.net/')
        }
        maven {
            name = 'NeoForged'
            url = uri('https://maven.neoforged.net/releases/')
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Auto-provisions the JDK required by the selected target (e.g. 21 for 1.21.x, 25 for 26.x)
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'shulkaero'

// ---------------------------------------------------------------------------
// Target selection: pass -Ptarget=<version> (see versions/*.properties).
// Defaults to the value of 'target' in gradle.properties.
// ---------------------------------------------------------------------------
def target = providers.gradleProperty('target').getOrElse('1.21.1')
def propsFile = new File(rootDir, "versions/${target}.properties")
if (!propsFile.exists()) {
    def available = new File(rootDir, 'versions').listFiles()
            .findAll { it.name.endsWith('.properties') }
            .collect { it.name - '.properties' }
            .sort()
            .join(', ')
    throw new GradleException("Unknown target '${target}'. Available targets: ${available}")
}
def targetProps = new Properties()
propsFile.withInputStream { targetProps.load(it) }

gradle.ext.target = target
gradle.ext.targetProps = targetProps
gradle.ext.universal = Boolean.parseBoolean(targetProps.getProperty('universal', 'false'))

// For MC >= 26.1 the game is unobfuscated, so a single "universal" jar
// (built by the :neoforge project, also containing the Fabric entrypoint and
// fabric.mod.json) works on both loaders. For 1.21.x, Fabric still runs on
// intermediary mappings, so a separate remapped Fabric jar is required.
if (!gradle.ext.universal) {
    include ':fabric'
}
include ':neoforge'
