name: Permission request
description: Ask for permission to do something the Shulkaero license does not allow on its own.
title: "[Permission] "
labels: ["permission"]
body:
  - type: markdown
    attributes:
      value: |
        Shulkaero is not open source (from 1.1.1 on). The [license](https://github.com/CptGummiball/Shulkaero/blob/main/LICENSE) lists what you may do and what needs written permission from CptGummiball.

        **You do not need to ask for:**
        * using Shulkaero in a modpack (public or private, free or paid) with the jar files **exactly as published**,
        * playing with Shulkaero on any server,
        * videos, streams, screenshots, reviews and guides,
        * making your own mod detect or interact with Shulkaero using the official jars as a compile-only dependency (without shipping Shulkaero files).

        For anything else, fill out this form. **A permission is only valid if CptGummiball grants it in writing in this issue.** It applies only to what is described here.

  - type: dropdown
    id: kind
    attributes:
      label: What do you want to do?
      options:
        - Publish a modified version of Shulkaero (patch, fork, port)
        - Include Shulkaero classes or files inside another mod
        - Re-upload or mirror Shulkaero outside a modpack (other website, launcher, server download)
        - Use Shulkaero textures, icons or texts in another project
        - Translate Shulkaero (language file or resource pack)
        - Look into Shulkaero's code (e.g. decompile it) for a compatibility project
        - Something else
    validations:
      required: true

  - type: input
    id: project
    attributes:
      label: Your project
      description: Name and link of the project, if it already exists.
      placeholder: "ExamplePack - https://example.org"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: What exactly do you plan?
      description: What would you change, use or publish? Which Shulkaero versions and files are involved?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why is it needed?
      description: Why can it not be done with the permissions the license already gives?
    validations:
      required: true

  - type: dropdown
    id: public
    attributes:
      label: Where and how will it be available?
      options:
        - Publicly, free
        - Publicly, paid or with monetization (ads, donations required, subscriptions)
        - Private or closed group only
        - Not decided yet
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: If you prefer another way to be contacted than this issue (e.g. Discord name). Do not post private data such as your address or phone number.

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I understand that I may only proceed after CptGummiball grants the permission in writing in this issue, and only within what is described here.
          required: true
        - label: I will credit Shulkaero and CptGummiball and link to the official download pages if the permission is granted.
          required: true
